name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  BUN_VERSION: "latest"

jobs:
  # Cheap, always-running job that decides which heavy jobs are needed
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - backend/**
              - .github/workflows/**
            frontend:
              - frontend/**
              - .github/workflows/**
            docker:
              - backend/**
              - frontend/**
              - docker-compose.yml
              - .github/workflows/**

  # Backend tests with Django + PostgreSQL
  backend:
    name: Backend Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    continue-on-error: true  # Allow backend to fail while project is being set up

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run linting
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Run type checking
        working-directory: backend
        continue-on-error: true
        run: |
          mypy apps config --ignore-missing-imports

      - name: Run migrations
        working-directory: backend
        env:
          DEBUG: "False"
          SECRET_KEY: test-secret-key
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          python manage.py migrate

      - name: Run tests
        working-directory: backend
        env:
          DEBUG: "False"
          SECRET_KEY: test-secret-key
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          pytest -v --cov=apps --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # Frontend tests with Bun + Vite
  frontend:
    name: Frontend Tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile || bun install

      - name: Run linting
        working-directory: frontend
        run: bun run lint || echo "No lint script configured"

      - name: Run type checking
        working-directory: frontend
        run: bun run typecheck

      - name: Build
        working-directory: frontend
        run: bun run build
        env:
          VITE_API_URL: http://localhost:8000/api

  # Docker build test
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    continue-on-error: true  # Allow docker build to fail while project is being set up
    needs: [changes, backend, frontend]
    # Run even if backend fails, but only when relevant paths changed
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.docker == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the lint step diffs against the base branch

      - name: Detect Django changes
        id: changes
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep -Eq '(^|/)(migrations/|models(/|\.py)|config/|scripts/db/|scripts/baselines/|pyproject\.toml|uv\.lock)'; then
            echo "django=true" >> "$GITHUB_OUTPUT"
          else
            echo "django=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.changes.outputs.django == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        if: steps.changes.outputs.django == 'true'
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Check migrations
        if: steps.changes.outputs.django == 'true'
        run: python3 scripts/db/check_migrations.py --base "origin/${{ github.base_ref }}"

  agents:
    name: Agent Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check AGENTS.md and skills
        run: python3 scripts/check_agents_md.py
